<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>
     <link rel="stylesheet" href="groupB.css" />
</head>
<body>
    <div class="card">
        <div class="hero-image">
            <div class="music-note note-1">♪</div>
            <div class="music-note note-2">♫</div>
            <div class="music-note note-3">♪</div>
            <div class="music-note note-4">♫</div>
            
            <div class="music-illustration">
                <div class="character">🎧</div>
            </div>
        </div>

        <div class="content">
            <h1>Order Summary</h1>
            <p class="description">
                You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!
            </p>

            <div class="plan-section">
                <div class="plan-info">
                    <div class="plan-icon">🎵</div>
                    <div class="plan-details">
                        <h3>Annual Plan</h3>
                        <p>$59.99/year</p>
                    </div>
                </div>
                <a class="change-link">Change</a>
            </div>

            <button class="proceed-button">Proceed to Payment</button>
            <button class="cancel-button">Cancel Order</button>
        </div>
    </div>
</body>
</html>
